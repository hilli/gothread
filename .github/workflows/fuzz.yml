name: Fuzz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"


      - name: Run fuzz tests
        run: |
          for dir in $(grep -rl 'func Fuzz' --include='*_test.go' . | xargs -I{} dirname {} | sort -u); do
            echo "Fuzzing $dir..."
            go test -fuzz=. -fuzztime=60s "$dir" || true
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crashes
          path: "**/testdata/fuzz/**/corpus/*"
