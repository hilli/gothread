name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run fuzz tests
        run: |
          for dir in $(grep -rl 'func Fuzz' --include='*_test.go' . | xargs -I{} dirname {} | sort -u); do
            echo "Fuzzing $dir..."
            go test -fuzz=. -fuzztime=60s "$dir" || true
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: "**/testdata/fuzz/**/corpus/*"
